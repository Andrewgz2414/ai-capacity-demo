[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicap"
version = "1.0.0"
description = "AI load, parameter uncertainty and capacity sizing (APMA 4903 code demo)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests (run_all.py, notebook execution)"]
